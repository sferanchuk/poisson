<script src="coverage.js"></script>
<script>
var i, j, k;
var d;
var maxlen = 10000;
var sc = Math.log( maxlen );
var ww = 20;
var ofy = Math.log( ww );

for ( i = 0; i < 4; i++ )
{
	d = "M ";
	for ( j = 0; j < maxlen; j += ww )
	{
		var s = 0;
		for ( k = j; k < j + ww; k++ )
		{
			if ( k == 0 ) continue;
			s += data[i][k];
		}
		if ( s == 0 ) continue;
		s /= ww;
		d += ( 200 * Math.log( j + 1 ) / sc ) + "," + ( 200 - 100 * ( ( Math.log( s ) + ofy ) / sc ) ) + " ";
	}
	var p = document.createElementNS( "http://www.w3.org/2000/svg", "path" );
	p.style.fill = "none";
	p.style.stroke = "black";
	p.style.strokeWidth = "2";
	p.setAttribute( "d", d );
	document.getElementById( "g" + ( i + 1 ) ).appendChild( p );
}

</script>
