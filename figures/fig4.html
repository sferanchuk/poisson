<script>
// Панель А: Линейная отрисовка уникальности бактерии (данные двумерные!)
var d = "";
var i;
var n = data_e.length;
for ( i = 0; i < n; i++ )
{
	var x = ((data_e[i][1]) * 200 / 300);
	if (x < 0) x = 0;
	var y = 200 - (data_e[i][0] * 200 / data_e[n - 1][0]);
	if (d === "") d = "M " + x + "," + y + " ";
	else d += "L " + x + "," + y + " ";
}
document.getElementById( "pe" ).setAttribute( "d", d );

// Панель C: Отрисовка Mappability губки (Log масштаб, данные двумерные!)
d = "";
n = data_a.length;
var sc_a = 20000;
for ( i = 0; i < n; i++ )
{
	if ( data_a[i][1] <= 1 ) continue;
	var x = (Math.log(data_a[i][1]) * 200 / Math.log( sc_a ));
	var y = 200 - (data_a[i][0] * 200 / data_a[n - 1][0]);
	if (d === "") d = "M " + x + "," + y + " ";
	else d += "L " + x + "," + y + " ";
}
document.getElementById( "pa" ).setAttribute( "d", d );
</script>

<script src="enterococcus_hist.js"></script>
<script src="amphimedon_hist.js"></script>
<script>
var maxlen = 10000;
var sc = Math.log( 120 );
var ww = 20;

// Панель B: Эмпирическое покрытие Enterococcus
d = "";
for ( var j = 0; j < maxlen; j += ww )
{
	var s = 0;
	for ( var k = 0; k < ww; k++ ) s += data_eh[ j + k ];
	if ( s < 1 ) continue;
	var x = ( 200 * Math.log( j + 1 ) / Math.log( maxlen ) );
	var y = ( 200 - 200 * ( Math.log( s ) / sc ) );
	if (d === "") d = "M " + x + "," + y + " ";
	else d += "L " + x + "," + y + " ";
}
document.getElementById( "peh" ).setAttribute( "d", d );

// Панель B: Модель Пуассона по точным MLE параметрам
d = "";
var mean = 3381, sd = 713;
for ( var j = mean - sd * 2; j < mean + sd * 2; j += ww ) {
    if (j < 0 || j >= maxlen) continue;
	var x = ( 200 * Math.log( j + 1 ) / Math.log( maxlen ) );
	var y = ( 25 + 175 * ( ( j - mean ) * ( j - mean ) / ( 4 * sd * sd ) ) );
	if (d === "") d = "M " + x + "," + y + " ";
	else d += "L " + x + "," + y + " ";
}
document.getElementById( "pem" ).setAttribute( "d", d );

// Панель D: Эмпирическое покрытие Amphimedon
sc = Math.log( 130000 );
d = "";
for ( var j = 0; j < maxlen; j += ww )
{
	var s = 0;
	for ( var k = 0; k < ww; k++ ) s += data_ah[ j + k ];
	if ( s < 1 ) continue;
	var x = ( 200 * Math.log( j + 1 ) / Math.log( maxlen ) );
	var y = ( 200 - 200 * ( Math.log( s ) / sc ) );
	if (d === "") d = "M " + x + "," + y + " ";
	else d += "L " + x + "," + y + " ";
}
document.getElementById( "pah" ).setAttribute( "d", d );

// ПАНЕЛЬ D: ЧИСТАЯ АСИМПТОТИЧЕСКАЯ МОДЕЛЬ ХВОСТА С MLE НАКЛОНОМ -0.4179
d = "M 140,87 L 200,172"; 
document.getElementById( "pam" ).setAttribute( "d", d );
</script>
