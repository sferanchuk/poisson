<script>
var i, j, k;

var ml_a = 40;
var sc_a = Math.log(10000000);

var d = "M ";

var x_d = [], y_d = [];
var ww = 20;

{
	var s = 0;
	for ( k = 0; k < ww; k++ ) s += data_l[ j + k ];
	if ( s < 1 ) continue;
	d += ( 200 * Math.log( j + 1 ) / Math.log( maxlen ) ) + "," + ( 200 - 200 * ( ( Math.log( s ) ) / sc ) ) + " ";

}

function calculateLinearMLE(x, y) {
    var n = x.length;
    if (n === 0 || n !== y.length) return null;

    // 1. Считаем средние значения (для формул регрессии)
    var sumX = 0, sumY = 0;
    for (var i = 0; i < n; i++) {
        sumX += x[i];
        sumY += y[i];
    }
    var meanX = sumX / n;
    var meanY = sumY / n;

    // 2. Находим наклон (a) и сдвиг (b) 
    // Математически для нормального шума MLE-оценки "a" и "b" в точности равны МНК
    var num = 0;
    var den = 0;
    for (var i = 0; i < n; i++) {
        num += (x[i] - meanX) * (y[i] - meanY);
        var diffX = x[i] - meanX;
        den += diffX * diffX;
    }
    
    var a = num / den;
    var b = meanY - a * meanX;

    // 3. Считаем сумму квадратов ошибок и находим MLE-оценку шума (sigma^2)
    var sumSquaredErrors = 0;
    for (var i = 0; i < n; i++) {
        var error = y[i] - (a * x[i] + b);
        sumSquaredErrors += error * error;
    }
    // MLE-оценка дисперсии шума делится строго на n (а не на n-1, как в МНК)
    var sigmaSquared = sumSquaredErrors / n; 
    var sigma = Math.sqrt(sigmaSquared);

    // 4. Вычисляем финальное максимальное Лог-Правдоподобие (Log-Likelihood)
    // Формула: sum( -ln(sigma) - 0.5*ln(2*pi) - (error^2)/(2*sigma^2) )
    var logLikelihood = 0;
    var constantPart = -0.5 * Math.log(2 * Math.PI);
    
    for (var i = 0; i < n; i++) {
        var error = y[i] - (a * x[i] + b);
        logLikelihood += -Math.log(sigma) + constantPart - (error * error) / (2 * sigmaSquared);
    }

    // Возвращаем объект со всеми MLE параметрами модели
    return {
        slope: a,               // Наклон прямой (alpha)
        intercept: b,           // Сдвиг прямой
        sigma: sigma,           // Оцененный масштаб шума
        logLikelihood: logLikelihood // Финальная метрика правдоподобия
    };
}

res = calculateLinearMLE( x_d, y_d );

function calculateLognormalMLE(x, y) {
    var n = x.length;
    if (n === 0 || n !== y.length) return null;

    // В логарифмических координатах логнормальное распределение — это квадратичная модель: y = a*x^2 + b*x + c
    // Находим параметры через систему линейных уравнений (МНК/MLE для параболы)
    var sX = 0, sX2 = 0, sX3 = 0, sX4 = 0;
    var sY = 0, sXY = 0, sX2Y = 0;

    for (var i = 0; i < n; i++) {
        var xi = x[i];
        var yi = y[i];
        var x2 = xi * xi;
        
        sX += xi;     sX2 += x2;     sX3 += x2 * xi;     sX4 += x2 * x2;
        sY += yi;     sXY += xi * yi; sX2Y += x2 * yi;
    }

    // Решаем матричное уравнение 3х3 методом Крамера
    var det = n*(sX2*sX4 - sX3*sX3) - sX*(sX*sX4 - sX2*sX3) + sX2*(sX*sX3 - sX2*sX2);
    if (Math.abs(det) < 1e-12) return null;

    var detA = sY*(sX2*sX4 - sX3*sX3) - sX*(sXY*sX4 - sX3*sX2Y) + sX2*(sXY*sX3 - sX2*sX2Y);
    var detB = n*(sXY*sX4 - sX3*sX2Y) - sY*(sX*sX4 - sX2*sX3) + sX2*(sX*sX2Y - sXY*sX2);
    var detC = n*(sX2*sX2Y - sX3*sXY) - sX*(sX*sX2Y - sX2*sXY) + sY*(sX*sX3 - sX2*sX2);

    var a = detA / det;
    var b = detB / det;
    var c = detC / det;

    // Считаем сумму квадратов ошибок и находим MLE-оценку шума (sigma)
    var sumSquaredErrors = 0;
    for (var i = 0; i < n; i++) {
        var pred = a * x[i] * x[i] + b * x[i] + c;
        var error = y[i] - pred;
        sumSquaredErrors += error * error;
    }
    var sigmaSquared = sumSquaredErrors / n;
    var sigma = Math.sqrt(sigmaSquared);

    // Вычисляем максимальное Лог-Правдоподобие (Log-Likelihood)
    var logLikelihood = 0;
    var constantPart = -0.5 * Math.log(2 * Math.PI);
    
    for (var i = 0; i < n; i++) {
        var pred = a * x[i] * x[i] + b * x[i] + c;
        var error = y[i] - pred;
        logLikelihood += -Math.log(sigma) + constantPart - (error * error) / (2 * sigmaSquared);
    }

    return {
        logLikelihood: logLikelihood,
        sigma: sigma
    };
}

res2 = calculateLognormalMLE( x_d, y_d );

var R = res.logLikelihood - res2.logLikelihood;

var LR_statistic = 2 * Math.abs(R);

// Простая функция для аппроксимации p-value распределения Хи-квадрат с 1 степенью свободы
function chi2_pvalue(chi2) {
    if (chi2 < 0) return 1;
    // Аппроксимация функции ошибок для 1 степени свободы
    var x = Math.sqrt(chi2 / 2);
    var t = 1.0 / (1.0 + 0.5 * x);
    var ans = t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37380870 + t * (0.09140461 + 
              t * (-0.01843403 + t * (0.39791134 + t * (-0.39921414 + t * (0.01067417 + 
              t * (0.64375491 + t * (-0.37688340 + t * 0.01032854))))))))));
    return ans;
}

var p_value = chi2_pvalue(LR_statistic);
